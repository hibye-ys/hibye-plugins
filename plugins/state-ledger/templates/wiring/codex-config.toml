# Codex 프로젝트 설정 스니펫 — 대상 프로젝트의 .codex/config.toml 에 병합.
# 공유 hook 스크립트(scripts/hooks/)를 Codex lifecycle 에 연결.
# hooks 는 기본 활성화([features].hooks = true). [hooks] 테이블만 선언.
# 스크립트는 git root 기준 경로로 호출 — 하위 디렉토리에서 codex 시작해도 안정 동작.

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'HOOK_PROJECT_DIR="$(git rev-parse --show-toplevel)" bash "$(git rev-parse --show-toplevel)/scripts/hooks/session-start-state-inject.sh"'
statusMessage = "STATE 주입 중"

[[hooks.PostToolUse]]
# Codex 파일 편집 툴 = apply_patch (matcher 로 Edit|Write 도 허용).
matcher = "apply_patch|Edit|Write"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'HOOK_PROJECT_DIR="$(git rev-parse --show-toplevel)" bash "$(git rev-parse --show-toplevel)/scripts/hooks/post-edit-state-stamp.sh"'
statusMessage = "STATE meta 스탬프 중"

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'HOOK_PROJECT_DIR="$(git rev-parse --show-toplevel)" bash "$(git rev-parse --show-toplevel)/scripts/hooks/stop-state-reminder.sh"'
timeout = 30
